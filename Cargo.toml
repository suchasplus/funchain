[package]
name = "funchain"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.43"
chrono-english = "0.1.8"
hex = "0.4.3"
rand = "0.10.0"
urlencoding = "2.1.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.5"

# Coverage configuration for cargo-llvm-cov
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage,coverage_nightly)"] }
