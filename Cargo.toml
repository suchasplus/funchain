[package]
name = "funchain"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = ["mt"]
# mt — Markdown viewer (mt-rs binary). Deps wired in incrementally M2-M6.
mt = [
  "dep:include_dir", "dep:minijinja", "dep:serde",
  "dep:comrak", "dep:syntect", "dep:two-face", "dep:regex", "dep:serde_yml",
  "dep:argh", "dep:webbrowser", "dep:walkdir",
  "dep:tiny_http", "dep:tungstenite", "dep:notify", "dep:crossbeam-channel",
]

[dependencies]
base64 = "0.22.1"
chrono = "0.4.43"
chrono-english = "0.1.8"
hex = "0.4.3"
rand = "0.10.0"
urlencoding = "2.1.3"
# mt — M2 (asset embedding + templating)
include_dir = { version = "0.7", optional = true }
minijinja = { version = "2", optional = true, default-features = false, features = ["builtins", "serde"] }
serde = { version = "1", optional = true, features = ["derive"] }
# mt — M3 (markdown pipeline)
comrak = { version = "0.30", optional = true, default-features = false }
syntect = { version = "5", optional = true, default-features = false, features = ["default-fancy"] }
# Extended syntax set (TypeScript, TOML, Dockerfile, …) — Sublime's default
# packages bundled with syntect lack these. Feature must match syntect's
# regex backend (fancy, pure Rust).
two-face = { version = "0.5", optional = true, default-features = false, features = ["syntect-fancy"] }
regex = { version = "1", optional = true }
serde_yml = { version = "0.0.12", optional = true }
# mt — M4 (CLI flow)
argh = { version = "0.1", optional = true }
webbrowser = { version = "1", optional = true }
# mt — M5 (site builder)
walkdir = { version = "2", optional = true }
# mt — M6 (serve mode)
tiny_http = { version = "0.12", optional = true }
tungstenite = { version = "0.24", optional = true, default-features = false, features = ["handshake"] }
notify = { version = "6", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.5"
insta = "1"
tungstenite = { version = "0.24", features = ["handshake"] }

# No build-dependencies — build.rs shells out to `git` and `date`.

[[bin]]
name = "mt-rs"
path = "src/bin/mt-rs.rs"
required-features = ["mt"]

# Release profile tuned for the mt-rs binary — the heaviest of the family.
# LTO + single codegen unit + symbol strip drop ~3-5 MB from the artifact.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Coverage configuration for cargo-llvm-cov
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage,coverage_nightly)"] }
